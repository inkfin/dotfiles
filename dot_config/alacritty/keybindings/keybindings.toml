[general]
import = ["~/.config/alacritty/keybindings/keybindings_win32.toml"]

[mouse]
bindings = [{ mouse = "Right", mods = "Control", action = "Paste" }]

[keyboard]
bindings = [
    { key = "/", mods = "Control", action = "ReceiveChar" },
    { key = "/", mode = "Vi|~Search", action = "ReceiveChar" },
    { key = "Minus", mods = "Control|Shift", action = "DecreaseFontSize" },
    { key = "Equals", mods = "Control|Shift", action = "IncreaseFontSize" },
    { key = "Key0", mods = "Control", action = "ResetFontSize" },
]
