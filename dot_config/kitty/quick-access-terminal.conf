# quick access terminal — quake 弹出终端, 对齐 iTerm2 Hotkey Window / ghostty Quick Terminal
# 用法: 运行 `kitten quick-access-terminal` 显示, 再运行一次(或 ctrl+d)隐藏。
# 全局热键(macOS): kitty 不支持原生注册系统全局热键, 需在
#   系统设置 → 键盘 → 键盘快捷键 → 服务 → 通用 → "Quick access to kitty" 里绑定
# (对齐 ghostty 的 global:ctrl+alt+z 就绑 ctrl+alt+z; 需 kitty 曾以该 kitten 启动过一次才会出现在服务列表)

# 与 ghostty quick-terminal-position=center 等价: 锚定四边铺满整屏
edge center

# quick 窗默认略透明(kitty 官方默认 0.85)
background_opacity 0.85

# 失焦自动隐藏, iTerm2 hotkey window 行为
hide_on_focus_loss yes
