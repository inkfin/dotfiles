# A TOML linter such as Tombi can use this schema to validate your config.
#:schema https://yazi-rs.github.io/schemas/yazi.json

# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml
[mgr]
sort_by = "natural"
linemode = "size"
show_hidden = false
title_format = "yazi: {cwd}"

[opener]
edit = [
    # Yazi may start outside zsh; select mini even when NVIM_APPNAME is absent.
    { run = 'NVIM_APPNAME="${NVIM_APPNAME:-nvim.mini}" nvim %s', desc = "nvim", block = true, for = "unix" },
    { run = 'nvim %s', block = true, desc = "nvim", for = "windows" },
    { run = 'code %s', orphan = true, desc = "code", for = "windows" },
    { run = 'code -w %s', block = true, desc = "code (block)", for = "windows" },
]

# git plugin
[[plugin.prepend_fetchers]]
id = "git"
url = "*"
run = "git"
group = "git"
[[plugin.prepend_fetchers]]
id = "git"
url = "*/"
run = "git"
group = "git"

# max-preview
[preview]
max_width  = 1000
max_height = 1000
